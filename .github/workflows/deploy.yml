# Автодеплой на Hostland: при каждом изменении в main сайт собирается
# и по FTP выгружается в xn--h1aaxcdl.net/htdocs/www.
# Нужны секреты репозитория: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
#
# Выгружаются только файлы из dist. Файлы, которых нет в сборке
# (api/, .htaccess, cgi-bin/, .well-known/), на сервере не трогаются:
# действие удаляет только то, что само загрузило раньше.

name: Deploy to Hostland

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostland
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload dist via FTP
        if: env.FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./xn--h1aaxcdl.net/htdocs/www/

      - name: Secrets missing
        if: env.FTP_PASSWORD == ''
        run: echo "::warning::FTP-секреты не заданы — сборка прошла, выгрузка пропущена."
